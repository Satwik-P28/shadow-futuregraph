[project]
name = "shadow-futuregraph"
version = "1.0.0"
description = "Counterfactual future debugging for personal AI — find, repair, and safely execute plan failures before they happen."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Shadow contributors" }]
dependencies = [
  "fastapi>=0.115.6,<1",
  "uvicorn>=0.34.0,<1",
  "pydantic>=2.10.4,<3",
  "sqlalchemy>=2.0.36,<3",
  "networkx>=3.4.2,<4",
  "numpy>=2.1.3,<3",
  "scipy>=1.14.1,<2",
  "httpx>=0.28.1,<1",
  "openai>=1.58.1,<2",
  "z3-solver>=4.13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "hypothesis>=6.122.3",
  "coverage>=7.6.10",
  "ruff>=0.8.4",
  "mypy>=1.13.0",
  "matplotlib>=3.9.3",
]

[project.scripts]
shadowbench = "shadow.benchmark.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.coverage.run]
source = ["shadow"]
omit = [
  "*/benchmark/*",
  "*/api/*",
  "*/integrations/*",
  "*/llm/client.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
omit = [
  "*/benchmark/*",
  "*/api/*",
  "*/integrations/*",
  "*/llm/client.py",
]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["shadow"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest_asyncio]
asyncio_mode = "auto"
